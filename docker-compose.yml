services:
  db:
    image: postgres:15-alpine
    container_name: hubify-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hubify
    ports:
      - "5435:5432" # Porta alterada para 5435 no Windows para evitar conflito com Postgres local
    volumes:
      - hubify-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hubify"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
    container_name: hubify-backend
    ports:
      - "8082:8081"
    environment:
      - PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:postgresql://136.115.245.229:5432/hubify
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=951405An@
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  video-server:
    build:
      context: ./video-server
    container_name: hubify-video-server
    ports:
      - "8080:8080"
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://hubify-backend-358184322842.us-central1.run.app/api
        VITE_SOCKET_URL: https://hubify-video-server-358184322842.us-central1.run.app
    container_name: hubify-frontend
    ports:
      - "5173:8080"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
      - video-server
    restart: always

volumes:
  hubify-db-data:
